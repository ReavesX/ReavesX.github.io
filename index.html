<link rel="stylesheet" href="styles/components/Navigation.css" />
<link rel="stylesheet" href="styles/base/global.css" />
<link rel="stylesheet" href="styles/components/Download.css" />
<link rel="stylesheet" href="styles/components/ModeToggle.css" />

<body>
  <header class="site-header">
    <div class="ModeToggle">
      <input type="checkbox" class="theme-checkbox" id="theme-checkbox" />
    </div>

    <div class="Navigation">
      <div class="tab-container">
        <input type="radio" name="tab" id="tab1" class="tab tab--1" />
        <label class="tab_label" for="tab1">Home</label>
        <input type="radio" name="tab" id="tab2" class="tab tab--2" />
        <label class="tab_label" for="tab2">About</label>
        <input type="radio" name="tab" id="tab3" class="tab tab--3" />
        <label class="tab_label" for="tab3">Skills</label>
        <input type="radio" name="tab" id="tab4" class="tab tab--4" />
        <label class="tab_label" for="tab4">Projects</label>
        <input type="radio" name="tab" id="tab5" class="tab tab--5" />
        <label class="tab_label" for="tab5">Contact</label>
        <div class="indicator"></div>
      </div>
    </div>

    <div class="Download Resume/CV">
      <div class="container">
        <label class="label">
          <input type="checkbox" class="input" id="download-checkbox" />
          <span class="circle"
            ><svg
              class="icon"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M12 19V5m0 14-4-4m4 4 4-4"
              ></path>
            </svg>
            <div class="square"></div>
          </span>
          <p class="title">Download Resume/CV</p>
          <p class="title">Open Resume/CV</p>
        </label>
      </div>
    </div>
  </header>
  <script src="js/index.js"></script>
</body>
