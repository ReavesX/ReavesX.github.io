<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Don Jackson - Portfolio</title>
  <link rel="stylesheet" href="styles/components/Navigation.css" />
  <link rel="stylesheet" href="styles/base/global.css" />
  <link rel="stylesheet" href="styles/components/Download.css" />
  <link rel="stylesheet" href="styles/components/ModeToggle.css" />
  <link rel="stylesheet" href="styles/components/Waves.css" />
  <link rel="stylesheet" href="styles/layout/Sections.css" />
  <link rel="stylesheet" href="styles/components/Typewriter.css" />
</head>

<body>
  <header class="site-header">
    <!-- Mode Toggle -->
    <div class="ModeToggle">
      <input type="checkbox" class="theme-checkbox" id="theme-checkbox" />
    </div>

    <!-- Navigation -->
    <div class="Navigation">
      <div class="tab-container">
        <input type="radio" name="tab" id="tab1" class="tab tab--1" />
        <label class="tab_label" for="tab1">Home</label>
        <input type="radio" name="tab" id="tab2" class="tab tab--2" />
        <label class="tab_label" for="tab2">About</label>
        <input type="radio" name="tab" id="tab3" class="tab tab--3" />
        <label class="tab_label" for="tab3">Skills</label>
        <input type="radio" name="tab" id="tab4" class="tab tab--4" />
        <label class="tab_label" for="tab4">Projects</label>
        <input type="radio" name="tab" id="tab5" class="tab tab--5" />
        <label class="tab_label" for="tab5">Contact</label>
        <div class="indicator"></div>
      </div>
    </div>

    <!-- Download Resume/CV -->
    <div class="Download Resume/CV">
      <div class="container">
        <label class="label">
          <input type="checkbox" class="input" id="download-checkbox" />
          <span class="circle"><svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M12 19V5m0 14-4-4m4 4 4-4"></path>
            </svg>
            <div class="square"></div>
          </span>
          <p class="title">Download Resume/CV</p>
          <p class="title">Open Resume/CV</p>
        </label>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <section id="home" class="content-section">
      <div class="terminal-container">
        <div class="terminal-header">
          <span class="terminal-button red"></span>
          <span class="terminal-button yellow"></span>
          <span class="terminal-button green"></span>
        </div>
        <div class="terminal-window">
          <span class="prompt">&gt;</span> <span id="typewriter-text"></span><span class="cursor">█</span>
        </div>
      </div>
    </section>

    <section id="about" class="content-section">
      <h2>About Me</h2>
      <p>Here is a little bit about who I am.</p>
    </section>

    <section id="skills" class="content-section">
      <h2>Skills</h2>
      <p>These are the technologies I work with.</p>
    </section>

    <section id="projects" class="content-section">
      <h2>Projects</h2>
      <p>Check out what I've built.</p>
    </section>

    <section id="contact" class="content-section">
      <h2>Contact</h2>
      <p>Get in touch.</p>
    </section>
  </main>

  <!-- Wave Container -->
  <div class="wave-container">
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
      viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
      <defs>
        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
      </defs>
      <g class="parallax">
        <use xlink:href="#gentle-wave" x="48" y="0" />
        <use xlink:href="#gentle-wave" x="48" y="3" />
        <use xlink:href="#gentle-wave" x="48" y="5" />
        <use xlink:href="#gentle-wave" x="48" y="7" />
      </g>
    </svg>
  </div>

  <!-- Script -->
  <script src="js/index.js?v=1"></script>
</body>

</html>
